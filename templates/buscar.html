<!DOCTYPE html>
<html>

<head>
    <title>Buscar cálculos</title>
</head>

<body style="background-color: lightblue; text-align: center;">

    <h1>Buscar cálculos guardados</h1>

    <!-- Primera forma de buscar: por el número (id) del cálculo -->
    <h3>Buscar por número (id)</h3>
    <form action="/buscar-id">
        Id del cálculo: <input type="text" name="id" />
        <input type="submit" value="Buscar" />
    </form>

    <!-- Segunda forma: por el tipo de producto -->
    <h3>Buscar por tipo de producto</h3>
    <form action="/buscar-categoria">
        <select name="categoria">
            {% for clave, nombre in categorias.items() %}
            <option value="{{ clave }}">{{ nombre }}</option>
            {% endfor %}
        </select>
        <input type="submit" value="Buscar" />
    </form>

    <!-- Tercera forma: ver todos los que hay -->
    <h3>Ver todos</h3>
    <div>
        <a href="/buscar-todos">Ver todos los cálculos guardados</a>
    </div>

    <br>
    <div>
        <a href="/">Volver al menú</a>
    </div>

</body>

</html>
