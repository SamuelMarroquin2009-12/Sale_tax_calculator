<!DOCTYPE html>
<html>

<head>
    <title>Calculadora de impuestos</title>
</head>

<!-- El color de fondo se pone con el atributo style del body.
     text-align: center centra todo lo que hay dentro (títulos, enlaces, botones) -->
<body style="background-color: lightblue; text-align: center;">

    <h1>Calculadora de impuestos de compra (Colombia)</h1>

    <p>Escoja lo que quiere hacer:</p>

    <!-- La etiqueta a crea un hipervínculo, en el atributo href va la URL a donde lleva -->
    <div>
        <a href="/nuevo">Calcular y guardar un impuesto</a>
    </div>
    <br>
    <div>
        <a href="/buscar">Buscar cálculos guardados</a>
    </div>
    <br>
    <div>
        <!-- Si la base de datos está en blanco, hay que pulsar esto primero -->
        <a href="/crear-tablas">Crear las tablas de la base de datos</a>
    </div>

    <p>Proyecto académico de Código Limpio. Las tarifas son las que usa esta calculadora y pueden cambiar por ley.</p>

</body>

</html>
